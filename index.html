<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Satellite Tracker & Orbit Visualizer</title>
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.0.0/satellite.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050508;
            color: #e0e6ed;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Overlay Cards */
        .ui-card {
            position: absolute;
            background: rgba(13, 17, 23, 0.85);
            border: 1px solid rgba(48, 54, 61, 0.8);
            backdrop-filter: blur(8px);
            border-radius: 8px;
            padding: 14px;
            z-index: 10;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        /* Top Header & Search */
        #header-panel {
            top: 15px;
            left: 15px;
            width: 320px;
        }

        #header-panel h1 {
            font-size: 1.2rem;
            color: #58a6ff;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-box {
            position: relative;
            margin-top: 8px;
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-size: 0.85rem;
        }

        .search-box input:focus {
            outline: none;
            border-color: #58a6ff;
        }

        /* Category Filter Tabs */
        .category-tabs {
            display: flex;
            gap: 4px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover, .tab-btn.active {
            background: #1f6feb;
            color: #ffffff;
            border-color: #388bfd;
        }

        /* Data Provenance Panel */
        #provenance-panel {
            top: 15px;
            right: 15px;
            width: 280px;
            font-size: 0.75rem;
        }

        #provenance-panel h3 {
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .prov-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .prov-label {
            color: #8b949e;
        }

        .prov-value {
            color: #c9d1d9;
            font-family: monospace;
        }

        .badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.68rem;
            font-weight: bold;
        }

        .badge-fresh { background: rgba(46, 160, 67, 0.2); color: #3fb950; border: 1px solid #2ea043; }
        .badge-stale { background: rgba(210, 153, 34, 0.2); color: #d29922; border: 1px solid #bb8009; }
        .badge-cached { background: rgba(56, 139, 253, 0.2); color: #58a6ff; border: 1px solid #1f6feb; }
        .badge-offline { background: rgba(248, 81, 73, 0.2); color: #f85149; border: 1px solid #da3633; }

        /* Sky Radar Canvas Container */
        #radar-panel {
            bottom: 15px;
            right: 15px;
            width: 220px;
            height: 240px;
            text-align: center;
        }

        #radar-canvas {
            background: #010409;
            border-radius: 50%;
            border: 1px solid #30363d;
            margin-top: 5px;
        }

        /* Overhead List Panel */
        #overhead-panel {
            bottom: 15px;
            left: 15px;
            width: 320px;
            max-height: 250px;
            display: flex;
            flex-direction: column;
        }

        #overhead-list {
            overflow-y: auto;
            max-height: 180px;
            margin-top: 8px;
        }

        .sat-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 8px;
            border-bottom: 1px solid #21262d;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .sat-item:hover {
            background: rgba(56, 139, 253, 0.15);
        }

        /* Detail Modal Card */
        #detail-panel {
            top: 200px;
            left: 15px;
            width: 320px;
            display: none;
        }

        .close-btn {
            float: right;
            cursor: pointer;
            color: #8b949e;
        }

        .close-btn:hover { color: #f85149; }

        /* Time Machine Controller */
        #time-panel {
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
        }

        .time-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        .time-btn:hover { background: #30363d; }

        /* Loading Indicator Overlay */
        #loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(1, 4, 9, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            transition: opacity 0.3s ease;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 3px solid #58a6ff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="webgl-container"></div>

    <!-- Loading Screen -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div style="margin-top: 12px; font-size: 0.9rem; color: #8b949e;" id="loading-text">Initializing Orbital Tracker...</div>
    </div>

    <!-- Header Panel -->
    <div id="header-panel" class="ui-card">
        <h1><i class="fas => fa-globe-americas"></i> SatTracker 3D</h1>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search satellite or NORAD ID...">
        </div>
        <div class="category-tabs">
            <button class="tab-btn active" data-group="stations">Stations</button>
            <button class="tab-btn" data-group="starlink">Starlink</button>
            <button class="tab-btn" data-group="visual">Brightest</button>
            <button class="tab-btn" data-group="active">Active</button>
            <button class="tab-btn" data-group="1999-025">Debris</button>
        </div>
    </div>

    <!-- Data Provenance Panel -->
    <div id="provenance-panel" class="ui-card">
        <h3>
            Data Pipeline 
            <i class="fas fa-sync-alt" id="force-refresh-btn" style="cursor: pointer;" title="Force Network Refresh"></i>
        </h3>
        <div class="prov-row"><span class="prov-label">Source:</span><span class="prov-value" id="prov-source">--</span></div>
        <div class="prov-row"><span class="prov-label">Feed:</span><span class="prov-value" id="prov-feed">--</span></div>
        <div class="prov-row"><span class="prov-label">Status:</span><span id="prov-status" class="badge">--</span></div>
        <div class="prov-row"><span class="prov-label">Fetch (UTC):</span><span class="prov-value" id="prov-fetch-time">--</span></div>
        <div class="prov-row"><span class="prov-label">Objects:</span><span class="prov-value" id="prov-objects">--</span></div>
        <div class="prov-row"><span class="prov-label">Median TLE Age:</span><span class="prov-value" id="prov-tle-age">--</span></div>
    </div>

    <!-- Satellite Detail Panel -->
    <div id="detail-panel" class="ui-card">
        <span class="close-btn" id="close-detail">&times;</span>
        <h2 id="sat-name" style="font-size: 1.0rem; color: #58a6ff; margin-bottom: 8px;">--</h2>
        <div class="prov-row"><span class="prov-label">NORAD ID:</span><span class="prov-value" id="sat-norad">--</span></div>
        <div class="prov-row"><span class="prov-label">Latitude:</span><span class="prov-value" id="sat-lat">--</span></div>
        <div class="prov-row"><span class="prov-label">Longitude:</span><span class="prov-value" id="sat-lng">--</span></div>
        <div class="prov-row"><span class="prov-label">Altitude:</span><span class="prov-value" id="sat-alt">--</span></div>
        <div class="prov-row"><span class="prov-label">Velocity:</span><span class="prov-value" id="sat-vel">--</span></div>
        <div class="prov-row"><span class="prov-label">Azimuth:</span><span class="prov-value" id="sat-az">--</span></div>
        <div class="prov-row"><span class="prov-label">Elevation:</span><span class="prov-value" id="sat-el">--</span></div>
    </div>

    <!-- Overhead Satellites Panel -->
    <div id="overhead-panel" class="ui-card">
        <h3 style="font-size: 0.85rem; color: #8b949e; text-transform: uppercase;">Passes Above Horizon</h3>
        <div id="overhead-list"></div>
    </div>

    <!-- 2D Sky Radar Panel -->
    <div id="radar-panel" class="ui-card">
        <h3 style="font-size: 0.75rem; color: #8b949e; text-transform: uppercase;">Sky Radar View</h3>
        <canvas id="radar-canvas" width="180" height="180"></canvas>
    </div>

    <!-- Time Machine Panel -->
    <div id="time-panel" class="ui-card">
        <button class="time-btn" id="time-reset"><i class="fas fa-undo"></i> Realtime</button>
        <button class="time-btn" id="time-pause"><i class="fas fa-pause"></i></button>
        <input type="range" id="time-slider" min="-86400" max="86400" value="0" style="width: 140px;">
        <span id="time-display" style="font-family: monospace; font-size: 0.8rem;">LIVE</span>
    </div>

    <script>
        // Emergency Static Seed Dataset for Offline Execution without Warm Cache
        const STATIC_FALLBACK_TLE_DATA = 
`ISS (ZARYA)             
1 25544U 98067A   24060.54832407  .00014389  00000+0  25829-3 0  9993
2 25544  51.6416 288.4284 0004812 110.1254 338.4526 15.49557404441440
TIANGONG
1 48274U 21035A   24060.52083333  .00008500  00000+0  10500-3 0  9991
2 48274  41.4720 150.2100 0003500 240.5000 119.4000 15.61000000164002
HUBBLE ST
1 20580U 90037B   24060.48510000  .00001200  00000+0  54000-4 0  9992
2 20580  28.4690  85.1200 0002800  95.4000 264.8000 15.08000000854001`;

        // ==========================================
        // PHASE 1: DATA SERVICE LAYER & PROVENANCE
        // ==========================================
        const DataService = {
            cache: new Map(),
            inFlightRequests: new Map(),

            ENDPOINTS: {
                active: 'https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=tle',
                stations: 'https://celestrak.org/NORAD/elements/gp.php?GROUP=stations&FORMAT=tle',
                starlink: 'https://celestrak.org/NORAD/elements/gp.php?GROUP=starlink&FORMAT=tle',
                visual: 'https://celestrak.org/NORAD/elements/gp.php?GROUP=visual&FORMAT=tle',
                '1999-025': 'https://celestrak.org/NORAD/elements/gp.php?GROUP=1999-025&FORMAT=tle'
            },

            fetchFeed: async function(category, options = {}) {
                const { forceRefresh = false } = options;

                // 1. Cache hit logic (Distinguish Online Cache vs Offline Cache)
                if (!forceRefresh && this.cache.has(category)) {
                    const cachedEntry = this.cache.get(category);
                    cachedEntry.provenance.status = navigator.onLine ? 'CACHED (ONLINE)' : 'OFFLINE — CACHED DATA';
                    return cachedEntry;
                }

                // 2. In-Flight Request Lock
                if (this.inFlightRequests.has(category)) {
                    return await this.inFlightRequests.get(category);
                }

                const fetchPromise = this._executeFetchWithRetry(category);
                this.inFlightRequests.set(category, fetchPromise);

                try {
                    return await fetchPromise;
                } finally {
                    this.inFlightRequests.delete(category);
                }
            },

            _executeFetchWithRetry: async function(category, maxRetries = 2) {
                const url = this.ENDPOINTS[category] || this.ENDPOINTS.stations;
                let attempt = 0;
                let delayMs = 1000;

                while (attempt <= maxRetries) {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 15000); // 15s Timeout

                    try {
                        const response = await fetch(url, { signal: controller.signal });

                        // Fast-fail on HTTP 403 / 429
                        if (response.status === 403 || response.status === 429) {
                            throw new Error(`HTTP_${response.status}_NO_RETRY`);
                        }

                        if (!response.ok) {
                            throw new Error(`HTTP_SERVER_ERROR_${response.status}`);
                        }

                        const textData = await response.text();
                        if (!textData || textData.trim().length === 0) {
                            throw new Error('MALFORMED_EMPTY_PAYLOAD');
                        }

                        const parsedPayload = this._processPayload(category, textData, response.status);
                        this.cache.set(category, parsedPayload);
                        return parsedPayload;

                    } catch (err) {
                        const isAbortError = err.name === 'AbortError';
                        const isNonRetryable = err.message.includes('HTTP_403') || err.message.includes('HTTP_429');

                        if (isNonRetryable || attempt === maxRetries) {
                            return this._handleFallback(category, err, isAbortError);
                        }

                        await new Promise(res => setTimeout(res, delayMs));
                        delayMs *= 2;
                        attempt++;
                    } finally {
                        clearTimeout(timeoutId);
                    }
                }
            },

            _processPayload: function(category, rawText, httpStatus) {
                const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                const epochTimestamps = [];

                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].startsWith('1 ')) {
                        const epochStr = lines[i].substring(18, 32).trim();
                        const yearTwoDigit = parseInt(epochStr.substring(0, 2), 10);
                        const dayOfYear = parseFloat(epochStr.substring(2));
                        const fullYear = (yearTwoDigit < 57) ? 2000 + yearTwoDigit : 1900 + yearTwoDigit;

                        const epochDate = new Date(Date.UTC(fullYear, 0, 1));
                        epochDate.setMilliseconds((dayOfYear - 1) * 86400 * 1000);
                        epochTimestamps.push(epochDate.getTime());
                    }
                }

                const nowUtc = Date.now();
                let statusBadge = 'FRESH (LIVE)';
                let medianAgeHours = 0;
                let oldestIso = 'N/A';
                let newestIso = 'N/A';

                if (epochTimestamps.length > 0) {
                    epochTimestamps.sort((a, b) => a - b);
                    oldestIso = new Date(epochTimestamps[0]).toISOString();
                    newestIso = new Date(epochTimestamps[epochTimestamps.length - 1]).toISOString();

                    const midIdx = Math.floor(epochTimestamps.length / 2);
                    const medianTimestamp = epochTimestamps.length % 2 !== 0 
                        ? epochTimestamps[midIdx] 
                        : (epochTimestamps[midIdx - 1] + epochTimestamps[midIdx]) / 2;

                    medianAgeHours = parseFloat(((nowUtc - medianTimestamp) / 3600000).toFixed(1));

                    if (medianAgeHours >= 24.0) {
                        statusBadge = 'STALE (LIVE)';
                    }
                }

                return {
                    rawText: rawText,
                    provenance: {
                        source: 'CelesTrak',
                        feed: category,
                        status: statusBadge,
                        fetchTimeUtc: new Date(nowUtc).toISOString(),
                        httpStatus: httpStatus,
                        objectCount: epochTimestamps.length,
                        oldestEpoch: oldestIso,
                        newestEpoch: newestIso,
                        medianAgeHours: medianAgeHours
                    }
                };
            },

            _handleFallback: function(category, error, isAbort) {
                if (this.cache.has(category)) {
                    const cached = this.cache.get(category);
                    cached.provenance.status = 'OFFLINE — CACHED DATA';
                    return cached;
                }

                return {
                    rawText: STATIC_FALLBACK_TLE_DATA,
                    provenance: {
                        source: 'Emergency Seed',
                        feed: category,
                        status: 'OFFLINE — SAMPLE DATA',
                        fetchTimeUtc: new Date().toISOString(),
                        httpStatus: error.message.includes('HTTP') ? error.message : (isAbort ? 'TIMEOUT' : 'NETWORK_ERROR'),
                        objectCount: 3,
                        oldestEpoch: 'N/A',
                        newestEpoch: 'N/A',
                        medianAgeHours: 0
                    }
                };
            }
        };

        // ==========================================
        // MAIN APPLICATION ENGINE & THREE.JS SETUP
        // ==========================================
        let scene, camera, renderer, controls;
        let earthMesh, atmosphereMesh;
        let satellitePoints, satelliteGeometry, satelliteMaterial;
        let activeSatellites = [];
        let selectedSatellite = null;
        let orbitPathLine = null;

        let observerGd = { latitude: 0, longitude: 0, height: 0 };
        let simulationOffsetMs = 0;
        let isPaused = false;
        let currentGroup = 'stations';

        // Initialize Application
        document.addEventListener('DOMContentLoaded', () => {
            initScene();
            initObserverLocation();
            initEventListeners();
            loadSatelliteData('stations');
            animate();
        });

        function initScene() {
            const container = document.getElementById('webgl-container');
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 25);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 8;
            controls.maxDistance = 80;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x333333);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
            sunLight.position.set(5, 3, 5);
            scene.add(sunLight);

            // Create 3D Globe Mesh
            const earthRadius = 6.371; // Base unit scaled
            const geometry = new THREE.SphereGeometry(earthRadius, 64, 64);
            
            // Texture Loader Fallback Styling
            const material = new THREE.MeshPhongMaterial({
                color: 0x1b2a4a,
                emissive: 0x081124,
                specular: 0x111111,
                shininess: 10,
                wireframe: false
            });

            earthMesh = new THREE.Mesh(geometry, material);
            scene.add(earthMesh);

            // Atmosphere Glow Shader
            const atmosGeometry = new THREE.SphereGeometry(earthRadius * 1.03, 64, 64);
            const atmosMaterial = new THREE.ShaderMaterial({
                vertexShader: `
                    varying vec3 vNormal;
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vNormal;
                    void main() {
                        float intensity = pow(0.6 - dot(vNormal, vec3(0, 0, 1.0)), 2.0);
                        gl_FragColor = vec4(0.34, 0.65, 1.0, 1.0) * intensity;
                    }
                `,
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide,
                transparent: true
            });

            atmosphereMesh = new THREE.Mesh(atmosGeometry, atmosMaterial);
            scene.add(atmosphereMesh);

            window.addEventListener('resize', onWindowResize);
        }

        function initObserverLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        observerGd.latitude = pos.coords.latitude * (Math.PI / 180);
                        observerGd.longitude = pos.coords.longitude * (Math.PI / 180);
                        observerGd.height = (pos.coords.altitude || 0) / 1000;
                    },
                    (err) => console.log('Geolocation denied. Defaulting to (0,0)')
                );
            }
        }

        async function loadSatelliteData(groupCategory, forceRefresh = false) {
            showLoading(true, `Fetching ${groupCategory.toUpperCase()} data...`);
            currentGroup = groupCategory;

            try {
                const dataset = await DataService.fetchFeed(groupCategory, { forceRefresh });
                updateProvenanceUI(dataset.provenance);
                parseAndBuildSatellites(dataset.rawText);
            } catch (err) {
                console.error('Failed to load satellite payload', err);
            } finally {
                showLoading(false);
            }
        }

        function parseAndBuildSatellites(tleText) {
            if (satellitePoints) scene.remove(satellitePoints);
            activeSatellites = [];

            const lines = tleText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const positions = [];
            const colors = [];

            for (let i = 0; i < lines.length; i += 3) {
                if (i + 2 >= lines.length) break;
                const name = lines[i].startsWith('1 ') ? `SAT-${i}` : lines[i];
                const line1 = lines[i].startsWith('1 ') ? lines[i] : lines[i+1];
                const line2 = lines[i].startsWith('1 ') ? lines[i+1] : lines[i+2];

                if (!line1 || !line2 || !line1.startsWith('1 ') || !line2.startsWith('2 ')) continue;

                try {
                    const satrec = satellite.twoline2satrec(line1, line2);
                    const noradId = line1.substring(2, 7).trim();

                    activeSatellites.push({
                        name: name,
                        noradId: noradId,
                        satrec: satrec,
                        positionVector: new THREE.Vector3()
                    });

                    positions.push(0, 0, 0);
                    colors.push(0.34, 0.65, 1.0);
                } catch (e) {}
            }

            satelliteGeometry = new THREE.BufferGeometry();
            satelliteGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            satelliteGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            satelliteMaterial = new THREE.PointsMaterial({
                size: 0.18,
                vertexColors: true,
                transparent: true,
                opacity: 0.9
            });

            satellitePoints = new THREE.Points(satelliteGeometry, satelliteMaterial);
            scene.add(satellitePoints);
        }

        function updatePositions() {
            if (!activeSatellites.length || !satelliteGeometry) return;

            const now = new Date(Date.now() + simulationOffsetMs);
            const gmst = satellite.gstime(now);
            const positions = satelliteGeometry.attributes.position.array;

            const overheadSats = [];

            for (let i = 0; i < activeSatellites.length; i++) {
                const sat = activeSatellites[i];
                const positionAndVelocity = satellite.propagate(sat.satrec, now);
                const positionEci = positionAndVelocity.position;

                if (positionEci && typeof positionEci !== 'boolean') {
                    const geodetic = satellite.eciToGeodetic(positionEci, gmst);
                    
                    // Convert to 3D Map Coordinates (Radius ~6.371 + altitude)
                    const rad = 6.371 + (geodetic.height / 1000);
                    const lat = geodetic.latitude;
                    const lon = geodetic.longitude;

                    const x = rad * Math.cos(lat) * Math.cos(lon);
                    const y = rad * Math.sin(lat);
                    const z = -rad * Math.cos(lat) * Math.sin(lon);

                    positions[i * 3] = x;
                    positions[i * 3 + 1] = y;
                    positions[i * 3 + 2] = z;
                    sat.positionVector.set(x, y, z);

                    // Sky Radar & Horizon Computation
                    const positionEcf = satellite.eciToEcf(positionEci, gmst);
                    const lookAngles = satellite.ecfToLookAngles(observerGd, positionEcf);

                    if (lookAngles.elevation > 0) {
                        overheadSats.push({
                            sat: sat,
                            elevation: lookAngles.elevation * (180 / Math.PI),
                            azimuth: lookAngles.azimuth * (180 / Math.PI),
                            range: lookAngles.rangeSat
                        });
                    }
                }
            }

            satelliteGeometry.attributes.position.needsUpdate = true;

            updateOverheadUI(overheadSats);
            renderRadar(overheadSats);

            if (selectedSatellite) {
                updateDetailPanel(selectedSatellite, now, gmst);
            }
        }

        function updateOverheadUI(overheadSats) {
            const listEl = document.getElementById('overhead-list');
            overheadSats.sort((a, b) => b.elevation - a.elevation);

            listEl.innerHTML = overheadSats.slice(0, 10).map(item => `
                <div class="sat-item" onclick="selectSatelliteByName('${item.sat.name}')">
                    <span>${item.sat.name}</span>
                    <span style="color: #3fb950;">${item.elevation.toFixed(1)}° El</span>
                </div>
            `).join('');
        }

        function renderRadar(overheadSats) {
            const canvas = document.getElementById('radar-canvas');
            const ctx = canvas.getContext('2d');
            const radius = canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Radar rings
            ctx.strokeStyle = '#30363d';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(radius, radius, radius - 2, 0, 2 * Math.PI);
            ctx.arc(radius, radius, radius * 0.66, 0, 2 * Math.PI);
            ctx.arc(radius, radius, radius * 0.33, 0, 2 * Math.PI);
            ctx.stroke();

            // Blips
            overheadSats.forEach(item => {
                const r = radius * (1 - (item.elevation / 90));
                const theta = (item.azimuth - 90) * (Math.PI / 180);

                const x = radius + r * Math.cos(theta);
                const y = radius + r * Math.sin(theta);

                ctx.fillStyle = '#58a6ff';
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, 2 * Math.PI);
                ctx.fill();
            });
        }

        function updateProvenanceUI(prov) {
            document.getElementById('prov-source').innerText = prov.source;
            document.getElementById('prov-feed').innerText = prov.feed;
            document.getElementById('prov-status').innerText = prov.status;
            document.getElementById('prov-fetch-time').innerText = prov.fetchTimeUtc;
            document.getElementById('prov-objects').innerText = prov.objectCount;
            document.getElementById('prov-tle-age').innerText = `${prov.medianAgeHours} hrs`;

            const statusEl = document.getElementById('prov-status');
            if (prov.status.includes('FRESH')) statusEl.className = 'badge badge-fresh';
            else if (prov.status.includes('STALE')) statusEl.className = 'badge badge-stale';
            else if (prov.status.includes('CACHED')) statusEl.className = 'badge badge-cached';
            else statusEl.className = 'badge badge-offline';
        }

        function updateDetailPanel(sat, now, gmst) {
            const positionAndVelocity = satellite.propagate(sat.satrec, now);
            const posEci = positionAndVelocity.position;
            const velEci = positionAndVelocity.velocity;

            if (posEci && typeof posEci !== 'boolean') {
                const geodetic = satellite.eciToGeodetic(posEci, gmst);
                const vel = Math.sqrt(velEci.x ** 2 + velEci.y ** 2 + velEci.z ** 2);

                document.getElementById('sat-name').innerText = sat.name;
                document.getElementById('sat-norad').innerText = sat.noradId;
                document.getElementById('sat-lat').innerText = (geodetic.latitude * (180 / Math.PI)).toFixed(2) + '°';
                document.getElementById('sat-lng').innerText = (geodetic.longitude * (180 / Math.PI)).toFixed(2) + '°';
                document.getElementById('sat-alt').innerText = geodetic.height.toFixed(1) + ' km';
                document.getElementById('sat-vel').innerText = vel.toFixed(2) + ' km/s';

                const posEcf = satellite.eciToEcf(posEci, gmst);
                const look = satellite.ecfToLookAngles(observerGd, posEcf);
                document.getElementById('sat-az').innerText = (look.azimuth * (180 / Math.PI)).toFixed(1) + '°';
                document.getElementById('sat-el').innerText = (look.elevation * (180 / Math.PI)).toFixed(1) + '°';

                renderOrbitPath(sat);
            }
        }

        function renderOrbitPath(sat) {
            if (orbitPathLine) scene.remove(orbitPathLine);

            const points = [];
            const now = Date.now() + simulationOffsetMs;
            
            // Step forward 90 minutes for full orbit track
            for (let t = 0; t <= 90; t += 2) {
                const futureTime = new Date(now + t * 60000);
                const gmst = satellite.gstime(futureTime);
                const pv = satellite.propagate(sat.satrec, futureTime);

                if (pv.position && typeof pv.position !== 'boolean') {
                    const geodetic = satellite.eciToGeodetic(pv.position, gmst);
                    const rad = 6.371 + (geodetic.height / 1000);
                    const x = rad * Math.cos(geodetic.latitude) * Math.cos(geodetic.longitude);
                    const y = rad * Math.sin(geodetic.latitude);
                    const z = -rad * Math.cos(geodetic.latitude) * Math.sin(geodetic.longitude);
                    points.push(new THREE.Vector3(x, y, z));
                }
            }

            const orbitGeometry = new THREE.BufferGeometry().setFromPoints(points);
            const orbitMaterial = new THREE.LineBasicMaterial({ color: 0x388bfd, transparent: true, opacity: 0.6 });
            orbitPathLine = new THREE.Line(orbitGeometry, orbitMaterial);
            scene.add(orbitPathLine);
        }

        function selectSatelliteByName(name) {
            const sat = activeSatellites.find(s => s.name === name);
            if (sat) {
                selectedSatellite = sat;
                document.getElementById('detail-panel').style.display = 'block';
            }
        }

        function initEventListeners() {
            // Category Buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    loadSatelliteData(e.target.dataset.group);
                });
            });

            // Force Refresh Button
            document.getElementById('force-refresh-btn').addEventListener('click', () => {
                loadSatelliteData(currentGroup, true);
            });

            // Close Detail Modal
            document.getElementById('close-detail').addEventListener('click', () => {
                document.getElementById('detail-panel').style.display = 'none';
                selectedSatellite = null;
                if (orbitPathLine) scene.remove(orbitPathLine);
            });

            // Time Machine Controls
            const slider = document.getElementById('time-slider');
            slider.addEventListener('input', (e) => {
                simulationOffsetMs = parseInt(e.target.value, 10) * 1000;
                document.getElementById('time-display').innerText = `${e.target.value}s`;
            });

            document.getElementById('time-reset').addEventListener('click', () => {
                simulationOffsetMs = 0;
                slider.value = 0;
                document.getElementById('time-display').innerText = 'LIVE';
            });

            document.getElementById('time-pause').addEventListener('click', () => {
                isPaused = !isPaused;
                document.getElementById('time-pause').innerHTML = isPaused ? '<i class="fas fa-play"></i>' : '<i class="fas fa-pause"></i>';
            });
        }

        function showLoading(show, text = '') {
            const overlay = document.getElementById('loading-overlay');
            if (text) document.getElementById('loading-text').innerText = text;
            overlay.style.opacity = show ? '1' : '0';
            overlay.style.pointerEvents = show ? 'all' : 'none';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!isPaused) {
                updatePositions();
            }

            earthMesh.rotation.y += 0.0001; // Slow background spin
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
